# Shared defaults for every environment and role. Overlays:
#   environment: application-local.yml, application-prod.yml, (tests) application-test.yml
#   role:        application-api.yml, application-worker.yml
# Activate from outside, e.g. SPRING_PROFILES_ACTIVE=local,api,worker. There is deliberately no
# default profile: a deploy that forgets to set one gets this strict base config, not dev settings.
spring:
  application:
    name: reconflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentreconflow}
    # M10.7: the application connects as reconflow_app, which can read and write data but owns
    # nothing (no DDL, no disabling triggers) and is subject to row-level security. Created by
    # infra/db/bootstrap-roles.sql. Empty password default keeps tests (whose connection details
    # come from TestcontainersConfiguration) free of placeholders; application-prod.yml re-declares
    # it with no default so prod fails fast.
    username: ${DB_APP_USER:reconflow_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      data-source-properties:
        # pgjdbc rewrites a JDBC batch of single-row INSERTs into multi-row INSERTs (M5.3): the
        # import's hot path sends 500 rows in a handful of statements instead of 500.
        reWriteBatchedInserts: true

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # No lazy loading during JSON serialization: fetch what you need inside the transaction.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Batch the smaller entities' inserts and updates too (the record hot path is plain JDBC).
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the schema owner, on their own connection (Boot opens it with these
    # credentials, separate from the app's pool). The app's role could not run them, by design.
    # In a deployed environment migrations become a separate step (M11.5) and the app's
    # environment won't hold this password at all.
    user: ${DB_MIGRATOR_USER:reconflow_migrator}
    password: ${DB_MIGRATOR_PASSWORD:}
    # The schema is created by migrations, never baselined from an existing one.
    # If Flyway refuses to start, the database was set up by hand: recreate it.
    baseline-on-migrate: false

  data:
    web:
      pageable:
        # api-design.md §4, for any endpoint that binds a Pageable: larger sizes are clamped.
        default-page-size: 50
        max-page-size: 200

  modulith:
    moments:
      # Spring Modulith's Moments (time-passing events, unused here) puts @EnableScheduling on
      # every node. Scheduled work (sweepers, partition maintenance, the job poller) must run on
      # worker nodes only, where WorkerSchedulingConfig enables scheduling.
      enabled: false

  mvc:
    problemdetails:
      # Spring MVC's own exceptions render as RFC 9457 ProblemDetail (GlobalExceptionHandler adds code/requestId).
      enabled: true
    async:
      # Streamed responses (M8.4's CSV export) run on an async thread holding a DB connection; a
      # client that stalls must not hold it forever.
      request-timeout: 60s

  lifecycle:
    # Graceful shutdown: in-flight requests finish, and job workers hand their jobs back at the next
    # chunk boundary (JobWorker.stop) within this budget.
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      # M10.3: the servlet container enforces the CSV contract's 50 MB (requirements.md) while it
      # parses the multipart body, before any controller runs; the code checks it again
      # (ImportReceiver, reconflow.import.max-file-size, same variable) and UploadLimitsCheck refuses
      # to start if the two disagree. A reverse proxy in front should cap the body too
      # (docs/security.md S-40): every layer that buffers needs its own limit.
      max-file-size: ${RECONFLOW_MAX_UPLOAD:50MB}
      max-request-size: ${RECONFLOW_MAX_REQUEST:51MB}  # the file plus the sourceType field; never below max-file-size
      file-size-threshold: 1MB      # larger uploads are buffered to a temp file, not the heap

server:
  port: ${PORT:8080}
  tomcat:
    # When an upload exceeds the multipart limit, Tomcat stops reading the body; past this many
    # unread bytes it resets the connection, and the client sees a network error instead of the
    # 413 file-too-large ProblemDetail (UploadSizeLimitIT). M10.3 kept 100 MB rather than the 2 MB
    # the plan suggests: api-design.md promises a readable 413 for an oversized file, and swallowed
    # bytes are discarded, never buffered to disk, so the cost is bandwidth for at most twice the
    # limit, bounded by connection-timeout. Anything larger is cut off.
    max-swallow-size: 100MB
    # Non-multipart form posts: the API takes JSON, so a big urlencoded body is never legitimate.
    max-http-form-post-size: 2MB
    # Slow-loris: a client that stops sending mid-request loses the connection after this long
    # without data (it is the socket read timeout, not a cap on a whole upload).
    connection-timeout: 20s
  # On SIGTERM, stop accepting requests and let in-flight ones finish.
  shutdown: graceful

management:
  metrics:
    tags:
      application: reconflow
    distribution:
      # Histogram buckets (not client-side percentiles): buckets add up across instances, so
      # Prometheus can compute a fleet-wide p95; SLO boundaries are exact buckets, so "what share of
      # requests met the 300 ms read SLO" is a count, not an estimate (M9.9, scalability.md §6).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s
        reconflow.import.duration: 30s, 2m, 5m
        reconflow.reconciliation.duration: 30s, 1m, 5m, 15m
  endpoints:
    web:
      exposure:
        # prometheus is reachable only on the management port, never through the public one
        # (SecurityConfig); application-local.yml and application-prod.yml set that port (M9.10).
        include: health,info,prometheus
  endpoint:
    health:
      # Anonymous callers see only {"status":"UP"}; component details help attackers.
      show-details: when-authorized
      probes:
        # /actuator/health/liveness and /readiness for the orchestrator.
        enabled: true
      group:
        # M9.11. Liveness: "is this process broken beyond repair?" A failure restarts the container,
        # so it checks only the application's own state, never a dependency: with the database in
        # liveness, a database outage would restart every instance in a loop, fixing nothing, and
        # they would all reconnect at once when it returned.
        liveness:
          include: livenessState
        # Readiness: "should this instance get traffic now?" A failure takes it out of rotation
        # without restarting it, which is the right answer to a dependency outage. On shutdown Boot
        # flips readinessState to REFUSING_TRAFFIC first, so the load balancer stops sending work.
        readiness:
          include: readinessState, db, storage

reconflow:
  auth:
    jwt:
      issuer: reconflow
      audience: reconflow-api
      access-token-ttl: 15m
      # PEM, from the environment only (authentication.plan §7). Without them, startup fails
      # unless generate-ephemeral-key is on, which only the local and test profiles set.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
  bootstrap:
    # One-time: creates the first platform admin in a fresh environment (security.bootstrap).
    admin-email: ${RECONFLOW_BOOTSTRAP_ADMIN_EMAIL:}
  rate-limit:
    # M10.4, per user per organization, token buckets in memory on each API node (so N nodes allow
    # up to N times this). The exact protection is jobs.max-pending-per-org below.
    import-upload:
      capacity: 10
      period: 1m
    run-create:
      capacity: 20
      period: 1m
  import:
    max-rows: 500000
    chunk-size: 5000                # rows per transaction, and the checkpoint granularity
    max-stored-errors: 10000        # per batch; error_rows still counts every bad row
    oldest-transaction-date: P2Y    # rows dated further back are DATE_OUT_OF_RANGE
    newest-transaction-date: P31D   # ...and further ahead
    max-file-size: ${RECONFLOW_MAX_UPLOAD:50MB}  # equal to spring.servlet.multipart.max-file-size (UploadLimitsCheck)
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:reconflow-imports}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  export:
    # M8.4: a run with at most this many exceptions streams its CSV in the response (200); a larger
    # one is exported by an EXPORT job into object storage (202 + a status URL to poll).
    sync-max-rows: 50000
  jobs:
    # The DB-backed queue (ADR 0004, shared.jobs). Times are the database's clock.
    poll-interval: 1s        # how often an idle worker looks for work
    lease: 2m                # a claim is valid this long without a heartbeat or a chunk fence
    heartbeat: 30s           # live workers extend their leases this often
    sweep-interval: 30s      # how often expired leases are recovered
    per-org-max-running: 2   # fairness: one tenant can't occupy every worker thread
    # M10.4: hard cap on an organization's QUEUED + RUNNING jobs, checked exactly (advisory lock) at
    # enqueue; over it the request is 429 rate-limited. Stops one client filling the queue and storage.
    max-pending-per-org: 50
    base-backoff: 10s        # retry delay = base × 2^attempts (ADR 0004): 20 s, 40 s, … 320 s
    max-backoff: 1h          # cap; with max_attempts 5 it never binds, but a raised limit would
    retention-done: 30d      # DONE jobs are deleted after this (JobRetention); history is in audit_event
    retention-failed: 180d   # FAILED ones are kept longer, for diagnosis
    worker:
      # The worker profile turns this on. Roles switch beans through this property,
      # not @Profile annotations, so profile names live only in YAML.
      enabled: false

logging:
  level:
    org.flywaydb: INFO
