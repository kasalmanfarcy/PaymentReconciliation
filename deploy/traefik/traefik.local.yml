# Traefik static configuration for the LOCAL REHEARSAL of the single-host deployment (M11.4). The
# edge: it terminates TLS, redirects HTTP to HTTPS, caps request bodies and rate-limits per client IP before anything reaches
# Keycloak or the API (docs/security.md S-40, S-43, S-44). Routes and limits: dynamic/routes.yml.
#
# LOCAL REHEARSAL ONLY (compose.local.yaml): the same edge, but no ACME, so nothing is sent to
# Let's Encrypt; dynamic/tls-local.yml serves a certificate from a throwaway local CA instead.

global:
  # Traefik phones home for version checks and anonymous statistics unless told not to.
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # X-Forwarded-* headers arriving from the internet are dropped and rewritten (the default, made
    # explicit): only Traefik says what the client's IP and scheme were.
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        # A 50 MB upload on a slow link: the whole request may take this long, no longer.
        readTimeout: 120s
    http:
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: false

ping: {}          # `traefik healthcheck --ping` for the container's health check

log:
  level: INFO
accessLog:
  # Client IPs and paths only; no headers (Authorization never reaches a log: S-50).
  fields:
    headers:
      defaultMode: drop
