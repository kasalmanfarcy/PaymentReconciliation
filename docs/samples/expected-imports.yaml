  sourceType: INTERNAL_LEDGER
  status: COMPLETED_WITH_ERRORS
  totalRows: 9
  validRows: 1
  errorRows: 8
  errors:
    - {row: 2, column: amount, code: INVALID_AMOUNT}
    - {row: 3, column: amount, code: AMOUNT_SCALE_EXCEEDED}
    - {row: 4, column: amount, code: AMOUNT_NOT_POSITIVE}
    - {row: 5, column: currency, code: INVALID_CURRENCY}
    - {row: 6, column: transaction_date, code: INVALID_DATE}
    - {row: 7, column: status, code: UNKNOWN_STATUS}
    - {row: 8, column: reference, code: MISSING_REQUIRED_FIELD}
    - {row: 9, column: null, code: MALFORMED_ROW}
  duplicates: []
  records:
    1: {normalizedReference: PAY-401, amount: "100.0000", transactionDate: "2026-10-05"}

gateway-wrong-headers.csv:
