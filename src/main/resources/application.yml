spring:
  application:
    name: reconflow

  # Local dev convenience: .env is gitignored, .env.example is the template.
  # Optional, so a deployment with real env vars (or CI) still starts.
  # Real OS environment variables win over anything in this file.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentreconflow}
    username: ${DB_USER:salmanfarcyka}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema is created by migrations, never baselined from an existing one.
    # If Flyway refuses to start, the database was set up by hand: recreate it.
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
