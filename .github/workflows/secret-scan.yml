# Secret scanning in CI (M10.5, cross-cutting "no secret in git history"). GitHub's own secret
# scanning with push protection is the first line (a repository setting, see docs/security.md);
# gitleaks here is the second, and it also runs on forks and locally:
#   docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml
# It runs the CLI from its container image: nothing leaves the runner.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: a secret deleted in a later commit is still leaked
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose
