# Scrapes ReconFlow's management port (M9.10). Local only: the target is the app on the host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: reconflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
