# Production. Secrets come only from environment variables (set by the platform);
# no .env file is read (only application-local.yml imports it).
spring:
  datasource:
    # No defaults: nothing should quietly fall back to localhost in production.
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    # M11.5: api and worker only validate the schema (reconflow.flyway.strategy below), which needs
    # no more than reading flyway_schema_history, so Flyway connects as the application role too.
    # The migrator's credentials exist only in the migrate step (application-migrate.yml).
    user: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}

reconflow:
  # Checked at startup by shared.config.RequiredPropertiesCheck: a missing one stops the
  # boot with a message naming it, before any bean is created. (The migrate role overrides it.)
  required-properties: DB_URL, DB_APP_USER, DB_APP_PASSWORD, OIDC_ISSUER_URI, KEYCLOAK_BASE_URL, KEYCLOAK_ADMIN_CLIENT_SECRET
  flyway:
    # Never migrate from an application instance: shared.db.FlywayStrategyConfig. A pending
    # migration fails the start, naming the version, and the platform keeps the old instances.
    strategy: validate

server:
  error:
    include-stacktrace: never
  # M11.4: deployed behind a TLS-terminating proxy (deploy/compose.prod.yaml: Traefik). "native" is
  # Tomcat's RemoteIpValve: X-Forwarded-For/-Proto are honoured only from internal proxy addresses
  # (10/8, 172.16/12, 192.168/16, loopback), so a client on the internet can't claim another IP or
  # scheme. It makes request.isSecure() true behind HTTPS, which is what lets HSTS be written (S-21).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

logging:
  structured:
    format:
      # One JSON object per line in Elastic Common Schema, built into Boot (no encoder dependency).
      # Log platforms index the fields, so you can query requestId = "4f1c..." or level = ERROR;
      # a stack trace stays one field instead of being split into many events. MDC entries
      # such as requestId are included automatically. Local runs keep readable text.
      console: ecs
    ecs:
      service:
        # name defaults to spring.application.name (reconflow).
        version: "@project.version@" # filled in at build time by Maven resource filtering
        environment: prod
        node-name: ${HOSTNAME:}

management:
  server:
    # Actuator (health probes, /actuator/prometheus) on its own port (M9.10): the load balancer
    # forwards only server.port, so metrics are never public; Prometheus and the orchestrator's
    # probes reach this one on the internal network.
    port: ${MANAGEMENT_PORT:8081}

springdoc:
  # M11.7: no OpenAPI document or Swagger UI in production (both 404); the committed docs/openapi.json
  # is the published contract.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
