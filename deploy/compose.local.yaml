# LOCAL REHEARSAL of the deployment (M11.4): compose.prod.yaml unchanged, plus stand-ins for the two
# managed services it expects (PostgreSQL 16 with both databases, MinIO as the S3 bucket), and a
# certificate from a throwaway local CA instead of Let's Encrypt. Nothing leaves the machine.
#
#   scripts/local_tls.sh                                  # once: deploy/local/certs (gitignored)
#   cp deploy/.env.local.example deploy/.env.local
#   docker build -t reconflow:local .
#   RECONFLOW_LOCAL=1 deploy/deploy.sh local              # the same script as a real deploy
#   scripts/demo.sh --no-start --deployed-local           # end to end through the edge
#   RECONFLOW_TAG=local docker compose -p reconflow-rehearsal --env-file deploy/.env.local \
#     -f deploy/compose.prod.yaml -f deploy/compose.local.yaml --profile migrate down -v
services:
  traefik:
    volumes:
      - ./traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic/routes.yml:/etc/traefik/dynamic/routes.yml:ro
      - ./traefik/tls-local.yml:/etc/traefik/dynamic/tls-local.yml:ro
      - ./local/certs:/certs:ro

  # Stand-in for the managed PostgreSQL 16: the roles and databases the runbook creates there.
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: paymentreconflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set DB_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/db/initdb:/docker-entrypoint-initdb.d:ro
      - ../infra/db/bootstrap-roles.sql:/reconflow/bootstrap-roles.sql:ro
      - ../infra/db/bootstrap-keycloak.sql:/reconflow/bootstrap-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentreconflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stand-in for the S3 bucket.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-reconflow-imports}
    restart: "no"

  keycloak:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
