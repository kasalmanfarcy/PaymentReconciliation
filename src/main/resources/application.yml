# Shared defaults for every environment and role. Overlays:
#   environment: application-local.yml, application-prod.yml, (tests) application-test.yml
#   role:        application-api.yml, application-worker.yml
# Activate from outside, e.g. SPRING_PROFILES_ACTIVE=local,api,worker. There is deliberately no
# default profile: a deploy that forgets to set one gets this strict base config, not dev settings.
spring:
  application:
    name: reconflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentreconflow}
    # Empty defaults keep tests (where @ServiceConnection supplies the real values) free of
    # placeholders; application-prod.yml re-declares them with no default so prod fails fast.
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      data-source-properties:
        # pgjdbc rewrites a JDBC batch of single-row INSERTs into multi-row INSERTs (M5.3): the
        # import's hot path sends 500 rows in a handful of statements instead of 500.
        reWriteBatchedInserts: true

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # No lazy loading during JSON serialization: fetch what you need inside the transaction.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Batch the smaller entities' inserts and updates too (the record hot path is plain JDBC).
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema is created by migrations, never baselined from an existing one.
    # If Flyway refuses to start, the database was set up by hand: recreate it.
    baseline-on-migrate: false

  data:
    web:
      pageable:
        # api-design.md §4, for any endpoint that binds a Pageable: larger sizes are clamped.
        default-page-size: 50
        max-page-size: 200

  mvc:
    problemdetails:
      # Spring MVC's own exceptions render as RFC 9457 ProblemDetail (GlobalExceptionHandler adds code/requestId).
      enabled: true

  lifecycle:
    # Graceful shutdown: in-flight requests finish, and job workers hand their jobs back at the next
    # chunk boundary (JobWorker.stop) within this budget.
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      # CSV contract limit (requirements: 50 MB); checked again in code by ImportReceiver
      # (reconflow.import.max-file-size), and hardened further in M10.3.
      max-file-size: 50MB
      max-request-size: 51MB        # the file plus the sourceType form field
      file-size-threshold: 1MB      # larger uploads are buffered to a temp file, not the heap

server:
  port: ${PORT:8080}
  # On SIGTERM, stop accepting requests and let in-flight ones finish.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Anonymous callers see only {"status":"UP"}; component details help attackers.
      show-details: when-authorized
      probes:
        # /actuator/health/liveness and /readiness for the orchestrator (M9.11 builds on it).
        enabled: true

reconflow:
  auth:
    jwt:
      issuer: reconflow
      audience: reconflow-api
      access-token-ttl: 15m
      # PEM, from the environment only (authentication.plan §7). Without them, startup fails
      # unless generate-ephemeral-key is on, which only the local and test profiles set.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
  bootstrap:
    # One-time: creates the first platform admin in a fresh environment (security.bootstrap).
    admin-email: ${RECONFLOW_BOOTSTRAP_ADMIN_EMAIL:}
  import:
    max-rows: 500000
    chunk-size: 5000                # rows per transaction, and the checkpoint granularity
    max-stored-errors: 10000        # per batch; error_rows still counts every bad row
    oldest-transaction-date: P2Y    # rows dated further back are DATE_OUT_OF_RANGE
    newest-transaction-date: P31D   # ...and further ahead
    max-file-size: 50MB             # keep equal to spring.servlet.multipart.max-file-size
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:reconflow-imports}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  jobs:
    # The DB-backed queue (ADR 0004, shared.jobs). Times are the database's clock.
    poll-interval: 1s        # how often an idle worker looks for work
    lease: 2m                # a claim is valid this long without a heartbeat or a chunk fence
    heartbeat: 30s           # live workers extend their leases this often
    sweep-interval: 30s      # how often expired leases are recovered
    per-org-max-running: 2   # fairness: one tenant can't occupy every worker thread
    base-backoff: 10s        # first retry delay after a transient failure; doubles per attempt
    max-backoff: 10m
    worker:
      # The worker profile turns this on. Roles switch beans through this property,
      # not @Profile annotations, so profile names live only in YAML.
      enabled: false

logging:
  level:
    org.flywaydb: INFO
