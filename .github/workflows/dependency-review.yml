# Dependency gate on every PR (M10.5): "did this PR add something known to be vulnerable?"
# Fast (seconds), because it only diffs the dependency graph against GitHub's advisory database.
# Free on public repositories; a private one needs GitHub Advanced Security.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # the summary comment on a failing PR

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          # high and critical block the merge; lower severities are reported by the weekly scan.
          # "low" would be so noisy that people learn to ignore the gate.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
