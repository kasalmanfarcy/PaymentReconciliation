# The import outcome of every sample file, transcribed from README.md in this folder (§1–§6).
# ImportSamplesIT (TASKS.md M5.22) uploads each file into a fresh organization, runs the import and
# compares the result with this table; it also fails if a .csv here has no entry. When you add a
# sample, add its expectations here and its explanation to README.md. README.md stays the
# human-readable source of truth: if the two disagree, fix this file.
#
# Keys per file:
#   sourceType           how it is uploaded
#   rejected             synchronous upload rejection (no batch is created): status, code, missingColumns
#   status, totalRows, validRows, errorRows      the batch after processing
#   errors               every stored row error: row, column (null = whole row), code
#   duplicates           source_row_numbers flagged is_duplicate_in_source (rule D1)
#   records              selected rows: expected normalized (and raw) values by source_row_number
#   sameRecordsAs        another sample whose normalized records must be identical, row for row
#   rawValueKeys         header keys kept in raw_values (rule N11), checked on row 1
# Dates are quoted so the YAML parser keeps them as strings.

ledger-basic.csv:
  sourceType: INTERNAL_LEDGER
  status: COMPLETED
  totalRows: 7
  validRows: 7
  errorRows: 0
  errors: []
  duplicates: []
  records:
    1: {normalizedReference: PAY-101, amount: "1000.0000", currency: AED, status: SUCCESS, transactionType: PAYMENT, transactionDate: "2026-10-01"}
    6: {rawReference: " pay-106 ", normalizedReference: PAY-106, amount: "120.5000", currency: AED, transactionDate: "2026-10-02"}
    7: {normalizedReference: PAY-107, status: FAILED}

gateway-basic.csv:
  sourceType: GATEWAY
  status: COMPLETED
  totalRows: 7
  validRows: 7
  errorRows: 0
  errors: []
  duplicates: [3, 4]
  records:
    1: {normalizedReference: PAY-101, amount: "1000.0000", currency: AED, status: SUCCESS, transactionType: PAYMENT, transactionDate: "2026-10-01"}
    5: {normalizedReference: PAY-105, amount: "300.0000", status: SUCCESS}
  rawValueKeys: [merchant_reference, amount, currency, status, transaction_at, gateway_transaction_id]

ledger-bom-crlf.csv:
  sourceType: INTERNAL_LEDGER
  status: COMPLETED
  totalRows: 7
  validRows: 7
  errorRows: 0
  errors: []
  duplicates: []
  sameRecordsAs: ledger-basic.csv
  rawValueKeys: [Transaction_At, AMOUNT, " Reference ", currency, Status, TRANSACTION_TYPE]

