name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build only reads the repository.
permissions:
  contents: read

jobs:
  build:
    # This exact name becomes the required status check on main (branch protection).
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, test, format check, coverage
        # verify = compile, unit tests (Surefire), Testcontainers integration tests (Failsafe),
        # Spotless check and JaCoCo reports. -B: batch mode; -ntp: no download progress noise.
        # Testcontainers uses the runner's Docker daemon, which ubuntu-latest has. No secrets are
        # needed: tests never touch a shared database, and it should stay that way.
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            target/site/jacoco/
            target/site/jacoco-it/
          retention-days: 7
