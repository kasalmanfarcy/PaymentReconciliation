# Local dependencies for ReconFlow: PostgreSQL 16, S3-compatible object storage and Keycloak.
#
#   cp .env.example .env      # Compose reads .env from this directory, like the app does
#   docker compose up -d
#   docker compose ps         # postgres, minio and keycloak: "healthy"; minio-init: exited (0)
#
# The whole stack in containers (M11.2), the app built from the Dockerfile and run with prod config:
#
#   docker compose --profile full up -d --build     # + migrate (exits 0), api :8080, worker
#   docker compose --profile full --profile observability up -d   # + Prometheus, Grafana
#
# scripts/demo.sh does that and then walks the demo. Services without a `profiles:` key always
# start; profiled ones only when asked.
#
# Data lives in named volumes and survives `docker compose down`.
# `docker compose down -v` wipes it (a fresh database re-runs every migration).
name: reconflow

# The application containers (M11.2): one image, three roles. Built once (the shared image name means
# compose builds it for the first service and reuses it). Each role gets only the environment it
# needs: api and worker the application role's database password, migrate the migrator's; neither
# gets the superuser's. Nothing is read from a .env inside the container (prod never imports one).
x-app: &app
  image: reconflow:local
  build: .
  restart: unless-stopped
  # The heap is 75% of this (Dockerfile); without a limit each JVM would size itself from the whole VM.
  mem_limit: 768m

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/paymentreconflow
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-reconflow-imports}
  S3_REGION: ${S3_REGION:-us-east-1}
  # Tokens say iss=http://localhost:8180/... (KC_HOSTNAME below, what curl on the host sees), and
  # the app compares that string. It fetches the signing keys over the compose network instead, so
  # it never needs "localhost" to mean Keycloak from inside a container.
  OIDC_ISSUER_URI: http://localhost:8180/realms/reconflow
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8180/realms/reconflow/protocol/openid-connect/certs
  KEYCLOAK_BASE_URL: http://keycloak:8180
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

services:
  postgres:
    # Pinned to the same tag as TestcontainersConfiguration, so local runs and tests use one engine.
    # A floating tag ("postgres:16") can change underneath you between two runs.
    image: postgres:16.4-alpine
    # pg_stat_statements (M9.6/M9.7): per-statement totals, the evidence behind every tuning change
    # and the Kafka decision (is the job claim among the top statements?). Enable once per database
    # with CREATE EXTENSION pg_stat_statements; preloading it costs a few hundred KB of shared memory.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: paymentreconflow
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Require passwords even for local connections, so credential mistakes show up here,
      # not on the first deploy. Only applied when the volume is first initialised.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # M10.7: read by infra/db/initdb/10-reconflow-roles.sh on first initialisation only.
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates reconflow_migrator (Flyway) and reconflow_app (the application) when the volume is
      # first initialised (M10.7). The superuser above is for humans only.
      - ./infra/db/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/db/bootstrap-roles.sql:/reconflow/bootstrap-roles.sql:ro
    healthcheck:
      # $$ passes a literal $ to the container shell (expanded there, not by Compose).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The official minio/minio image is no longer published on Docker Hub; pgsty/minio is a
    # maintained community build of the same server (it also ships the `mc` client).
    # Pinned to a release tag: check https://hub.docker.com/r/pgsty/minio/tags before bumping.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the bucket once MinIO is healthy, then exits with code 0.
  # --ignore-existing makes it idempotent, so it is safe on every `up`.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy # waits for the health check, not just for the container to start
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-reconflow-imports}
    restart: "no"

  # Identity provider (M10.1): issues every access token; ReconFlow only validates them.
  # start-dev = embedded H2 database and plain HTTP: local only. A deployed Keycloak runs `start`,
  # with its own PostgreSQL database and TLS (M11). The realm (clients, policies, demo users) is
  # imported from git on first start, so it is reproducible; it is never re-imported over changes.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2   # pinned; check quay.io/keycloak/keycloak tags before bumping
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # One issuer URL for the browser and the app alike: Keycloak writes the hostname it was reached
      # on into `iss`, and a mismatch is a confusing 401 on every request.
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm file's ${...} placeholder at import: the secret stays out of git.
      RECONFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - "8180:8180"
    volumes:
      - ./infra/keycloak/realm-reconflow.json:/opt/keycloak/data/import/realm-reconflow.json:ro
    healthcheck:
      # Health is on the management port (9000, not published); the image has no curl.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # --- The application in containers (M11.2): `docker compose --profile full up -d --build` ---------

  # One-off: applies the migrations as reconflow_migrator, then exits 0 (M11.5). api and worker wait
  # for it to complete successfully, so a failed migration starts nothing new.
  migrate:
    <<: *app
    profiles: [full]
    restart: "no"
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod,migrate
      DB_URL: jdbc:postgresql://postgres:5432/paymentreconflow
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-reconflow_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    profiles: [full]
    environment:
      <<: *app-env
      # demo: seeds the two demo organizations linked to the realm's accounts (application-demo.yml).
      SPRING_PROFILES_ACTIVE: prod,api,demo
      DB_APP_USER: ${DB_APP_USER:-reconflow_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    # Only the public port. The management port (8081: probes, metrics) stays on the compose network.
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  worker:
    <<: *app
    profiles: [full]
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: prod,worker
      DB_APP_USER: ${DB_APP_USER:-reconflow_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # --- Observability (M9.10): `docker compose --profile observability up -d` -------------------
  # Off by default, so a plain `docker compose up` stays light. Scrapes the app running on the host
  # (its management port, 8081) and, with the full profile, the api and worker containers. Docker Desktop resolves host-gateway to the host; on Colima set
  # HOST_GATEWAY=192.168.5.2 (host.lima.internal) in .env.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
  grafana-data:
