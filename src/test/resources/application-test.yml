# Test profile (test resources only, so it never ships). The datasource comes from the
# Testcontainers PostgreSQL via @ServiceConnection; nothing here needs a .env.
spring:
  datasource:
    # Overridden by @ServiceConnection; present so the placeholders always resolve.
    username: test
    password: test

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

reconflow:
  auth:
    jwt:
      # Tests never use a committed key: a pair is generated when the context starts.
      generate-ephemeral-key: true
  import:
    # Small chunks, so a 1,000-row fixture spans 10 chunk commits (M5.14, M5.25).
    chunk-size: 100
