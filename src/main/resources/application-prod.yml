# Production. Secrets come only from environment variables (set by the platform);
# no .env file is read (only application-local.yml imports it).
spring:
  datasource:
    # No defaults: nothing should quietly fall back to localhost in production.
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}

reconflow:
  # Checked at startup by shared.config.RequiredPropertiesCheck: a missing one stops the
  # boot with a message naming it, before any bean is created.
  required-properties: DB_URL, DB_APP_USER, DB_APP_PASSWORD, DB_MIGRATOR_USER, DB_MIGRATOR_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY

server:
  error:
    include-stacktrace: never

logging:
  structured:
    format:
      # One JSON object per line in Elastic Common Schema, built into Boot (no encoder dependency).
      # Log platforms index the fields, so you can query requestId = "4f1c..." or level = ERROR;
      # a stack trace stays one field instead of being split into many events. MDC entries
      # such as requestId are included automatically. Local runs keep readable text.
      console: ecs
    ecs:
      service:
        # name defaults to spring.application.name (reconflow).
        version: "@project.version@" # filled in at build time by Maven resource filtering
        environment: prod
        node-name: ${HOSTNAME:}

management:
  server:
    # Actuator (health probes, /actuator/prometheus) on its own port (M9.10): the load balancer
    # forwards only server.port, so metrics are never public; Prometheus and the orchestrator's
    # probes reach this one on the internal network.
    port: ${MANAGEMENT_PORT:8081}
