name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build only reads the repository.
permissions:
  contents: read

jobs:
  build:
    # This exact name becomes the required status check on main (branch protection).
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Migration rollback notes
        # M11.5: every migration from V13 on says what to do if its release is rolled back.
        run: scripts/check_migration_notes.sh

      - name: Build, test, format check, coverage
        # verify = compile, unit tests (Surefire), Testcontainers integration tests (Failsafe),
        # Spotless check and JaCoCo reports. -B: batch mode; -ntp: no download progress noise.
        # Testcontainers uses the runner's Docker daemon, which ubuntu-latest has. No secrets are
        # needed: tests never touch a shared database, and it should stay that way.
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            target/site/jacoco/
            target/site/jacoco-it/
          retention-days: 7

  # M11.1/M11.3: on every PR and push, after the tests pass: build the production image, check it
  # runs as the non-root uid, and scan it. Nothing is pushed here, so it needs no write permission
  # (a PR from a fork can run it safely).
  image:
    name: image
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reconflow:ci
          # Shared with publish-image below, so the push rebuilds nothing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs as uid 10001, not root
        run: test "$(docker run --rm --entrypoint id reconflow:ci -u)" = "10001"

      - name: Scan the image (Trivy)
        # The CLI from its pinned image, as secret-scan.yml runs gitleaks: only the vulnerability
        # database is downloaded. Fails on a HIGH or CRITICAL finding that has a fix available.
        run: |
          docker save reconflow:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/work" aquasec/trivy:0.76.2 image \
            --input /work/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  # M11.3: every merge to main ships exactly what CI tested, identified by an immutable tag:
  # ghcr.io/kasalmanfarcy/reconflow:sha-<40 hex>, plus a moving `main`. A red build or a failed image
  # check publishes nothing (needs). Deploys use the SHA tag (docs/runbooks/deploy.md).
  publish-image:
    name: publish-image
    needs: [build, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN can push to this repository's GHCR packages; no personal token
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Written out in lowercase: the repository name has capitals and GHCR refuses them.
          images: ghcr.io/kasalmanfarcy/reconflow
          tags: |
            type=sha,format=long
            type=raw,value=main

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # BuildKit attaches build provenance and an SBOM to the pushed image as attestations.
          provenance: mode=max
          sbom: true
