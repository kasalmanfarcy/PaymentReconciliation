# Submits the *resolved* Maven dependency tree to GitHub's dependency graph on every push to main
# (M10.5). GitHub's static pom.xml parser misses most transitive dependencies (it can't evaluate
# the Spring Boot parent's BOM), so without this dependency review would compare incomplete graphs
# and Dependabot alerts would miss transitive CVEs.
name: dependency-submission

on:
  push:
    branches: [main]

permissions:
  contents: write   # required by the dependency submission API

jobs:
  submit:
    name: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: advanced-security/maven-dependency-submission-action@v6
