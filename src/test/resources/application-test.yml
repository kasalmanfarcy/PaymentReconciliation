# Test profile (test resources only, so it never ships). The datasource comes from the
# Testcontainers PostgreSQL (TestcontainersConfiguration: the app as reconflow_app, Flyway as
# reconflow_migrator, M10.7); nothing here needs a .env.
spring:
  flyway:
    # The migrations, plus a test-only callback that lets the queue tests use their own job type
    # (db/test-callbacks/afterMigrate__allow_test_job_type.sql).
    locations: classpath:db/migration,classpath:db/test-callbacks
  datasource:
    # Overridden by TestcontainersConfiguration's connection details; present so the placeholders
    # always resolve.
    username: test
    password: test

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

reconflow:
  import:
    # Small chunks, so a 1,000-row fixture spans 10 chunk commits (M5.14, M5.25).
    chunk-size: 100
