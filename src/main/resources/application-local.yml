# Laptop: compose.yaml dependencies, readable logs, verbose SQL.
# Usually run as SPRING_PROFILES_ACTIVE=local,api,worker.
spring:
  config:
    # Only the local profile reads .env (gitignored; .env.example is the template). Keeping the
    # import here, not in application.yml, means tests and prod can never pick up a stray .env.
    # Real OS environment variables still win over values in the file.
    import: optional:file:.env[.properties]

logging:
  level:
    com.reconflow: DEBUG
    # Every SQL statement while developing.
    org.hibernate.SQL: DEBUG
  pattern:
    # Prefix every line with the request ID (blank outside a request): "[4f1c2a9e8b7d4c3a] ".
    correlation: "[%X{requestId:-}] "

management:
  endpoint:
    health:
      show-details: always

reconflow:
  storage:
    # compose.yaml's MinIO. Without this default, a .env missing S3_ENDPOINT would send uploads to
    # AWS's real S3 endpoint (a blank endpoint means AWS in StorageProperties).
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
  seed:
    # Two organizations, a user per role, a two-org user and a platform admin (security.seed).
    # Local only: no other profile turns this on, so prod can never seed.
    enabled: true
    # Every seeded user's password. A documented demo value, not a secret; README lists the accounts.
    password: ${RECONFLOW_SEED_PASSWORD:reconflow-local-demo}
  auth:
    jwt:
      # A fresh RSA key pair per start (logged as a warning); tokens die on restart.
      generate-ephemeral-key: true
    cookie:
      # Safari may refuse Secure cookies on http://localhost. Every other profile keeps true.
      secure: false
